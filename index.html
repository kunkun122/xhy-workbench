<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鑫汇盈荐股频率监控台</title>
<style>
:root{
  --bg:#0e1116; --panel:#161b22; --panel2:#1c222b; --border:#232a33;
  --text:#e6edf3; --muted:#8b949e; --accent:#58a6ff;
  --blue:#58a6ff;
  --amber:#e3a008;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,"PingFang SC","Microsoft YaHei",Segoe UI,Roboto,sans-serif;font-size:14px;line-height:1.5;padding:18px 22px 60px}
h1{font-size:20px;font-weight:600;display:flex;align-items:center;gap:10px}
h2{font-size:15px;font-weight:600;margin-bottom:12px;color:#cdd6e0}
.sub{color:var(--muted);font-size:12px;font-weight:400}
.topbar{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:10px;margin-bottom:16px;border-bottom:1px solid var(--border);padding-bottom:14px}
.meta{color:var(--muted);font-size:12px;line-height:1.7}
.meta b{color:var(--text);font-weight:600}

/* filter bar */
.filters{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:16px}
.fld{display:flex;flex-direction:column;gap:4px}
.fld label{font-size:11px;color:var(--muted)}
.fld select{background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:6px 10px;font-size:13px;min-width:140px}
.btn{background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:7px 14px;font-size:13px;cursor:pointer;transition:.15s}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);color:#06243f;border-color:var(--accent);font-weight:600}
.btn.primary:hover{filter:brightness(1.1);color:#06243f}
.seg{display:flex;border:1px solid var(--border);border-radius:6px;overflow:hidden}
.seg button{background:var(--panel2);color:var(--muted);border:none;padding:6px 12px;font-size:12px;cursor:pointer}
.seg button.on{background:var(--accent);color:#06243f;font-weight:600}

/* kpi */
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:18px}
.kpi{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px 16px}
.kpi .v{font-size:24px;font-weight:700;line-height:1.1}
.kpi .l{font-size:12px;color:var(--muted);margin-top:6px}
.kpi .v.blue{color:var(--blue)} .kpi .v.amber{color:var(--amber)}

/* layout */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:16px 18px}
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:16px;font-size:12px;color:var(--muted);margin-top:8px;flex-wrap:wrap}
.legend i{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:5px;vertical-align:middle}

/* matrix */
.matrix-wrap{overflow:auto;max-height:520px}
.matrix{width:100%;border-collapse:separate;border-spacing:0;font-size:12px}
.matrix th,.matrix td{padding:7px 10px;text-align:center;border-bottom:1px solid var(--border);border-right:1px solid var(--border);white-space:nowrap;position:relative}
.matrix thead th{position:sticky;top:0;background:var(--panel);z-index:2}
.matrix th:first-child,.matrix td:first-child{position:sticky;left:0;background:var(--panel);z-index:3;text-align:left}
.matrix th:first-child{z-index:4}
.matrix td{cursor:pointer}
.matrix td:hover{filter:brightness(1.15)}
.matrix .row-total{font-weight:700;background:var(--panel2)}
.matrix .col-total{font-weight:700;background:var(--panel2);position:sticky;left:0;z-index:3}
.matrix .corner{font-weight:700;background:var(--panel)}
.cell-val{position:relative;z-index:1}

/* table */
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap}
th{color:var(--muted);font-weight:600;position:sticky;top:0;background:var(--panel);cursor:pointer;user-select:none}
th:hover{color:var(--accent)}
tbody tr:hover{background:var(--panel2)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px}
.tag.buy{background:rgba(88,166,255,.15);color:var(--blue)}
.tag.sell{background:rgba(227,160,8,.15);color:var(--amber)}
.note-input{background:var(--panel2);border:1px solid var(--border);border-radius:5px;color:var(--text);padding:4px 7px;font-size:12px;width:130px}
.tbl-wrap{max-height:430px;overflow:auto;border:1px solid var(--border);border-radius:8px}
.pill{font-size:11px;color:var(--muted)}
#tbl-detail.grouped .col-month{display:none}
#tbl-detail .grp td{background:#1b212b;color:var(--text);font-weight:600;border-top:1px solid var(--border);padding:9px 10px}
footer{margin-top:24px;color:var(--muted);font-size:12px;text-align:center}
@media(max-width:1200px){.kpis{grid-template-columns:repeat(3,1fr)}.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="topbar">
  <div>
    <h1>鑫汇盈荐股频率监控台 <span class="sub">· 按荐股日期统计每月各组合推荐频次</span></h1>
  </div>
  <div class="meta" id="meta"></div>
</div>

<div class="filters">

  <div class="fld"><label>起始月</label><select id="f-start"></select></div>
  <div class="fld"><label>结束月</label><select id="f-end"></select></div>
  <div class="fld">
    <label>&nbsp;</label>
    <div style="display:flex;gap:8px">
      <button class="btn primary" id="btn-reset">重置筛选</button>
      <button class="btn" id="btn-csv">导出CSV</button>
    </div>
  </div>
</div>

<div class="kpis" id="kpis"></div>

<div class="grid2">
  <div class="card">
    <h2>月度荐股分布（持仓 / 平仓）</h2>
    <div class="chart" id="chart-monthly"></div>
    <div class="legend"><span><i style="background:var(--blue)"></i>已买入（持仓）</span><span><i style="background:var(--amber)"></i>已卖出（平仓）</span></div>
  </div>
  <div class="card">
    <h2>组合 × 月份推荐频率热力图 <span class="pill">点击单元格可下钻到明细</span></h2>
    <div class="matrix-wrap">
      <table class="matrix" id="tbl-matrix">
        <thead></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
</div>

<div class="grid2">
  <div class="card">
    <h2>组合排行（按荐股笔数）</h2>
    <div class="chart" id="chart-portfolio"></div>
  </div>
  <div class="card">
    <h2>组合活跃概览</h2>
    <div class="tbl-wrap" style="max-height:380px">
      <table id="tbl-portfolio">
        <thead><tr><th data-k="portfolio">组合</th><th class="num" data-k="count">笔数</th><th class="num" data-k="holding">持仓</th><th class="num" data-k="closed">平仓</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
</div>

<div class="card">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:10px;flex-wrap:wrap">
    <h2 style="margin:0">荐股明细 <span class="pill" id="detail-count"></span></h2>
    <div class="seg" id="seg-detail">
      <button data-v="list">列表</button>
      <button data-v="month" class="on">按月分组</button>
    </div>
  </div>
  <div class="tbl-wrap">
    <table id="tbl-detail">
      <thead><tr>
        <th data-k="manager">主理人</th><th data-k="portfolio">组合</th><th data-k="code">代码</th>
        <th data-k="name">名称</th><th data-k="market">市场</th><th class="num" data-k="buyPrice">买入价</th>
        <th class="num" data-k="sellPrice">卖出价</th><th class="num" data-k="ret">荐股收益率</th>
        <th data-k="recMonth" class="col-month">荐股月份</th><th data-k="recDate">荐股日期</th><th data-k="updDate" title="Excel 更新日期">卖出日期</th><th data-k="status">状态</th><th data-k="note">备注</th>
      </tr></thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<footer>鑫汇盈荐股频率监控台 · 单文件离线版 · 筛选条件与备注自动保存在本地浏览器（localStorage）</footer>

function saveFilters(){localStorage.setItem('xhy_filters',JSON.stringify({portfolio:state.portfolio,market:state.market,status:state.status,start:state.start,end:state.end}));}

function applyFilters(){
  return DATA.rows.filter(r=>{
    if(state.portfolio!=='ALL' && r.portfolio!==state.portfolio) return false;
    if(state.market!=='ALL' && r.market!==state.market) return false;
    if(state.status!=='ALL' && r.status!==state.status) return false;
    const m = r.recMonth;
    if(m==null) return false;
    if(state.start && m<state.start) return false;
    if(state.end && m>state.end) return false;
    return true;
  });
}

function renderKPIs(rows){
  const total=rows.length;
  const holding=rows.filter(r=>r.status==='已买入').length;
  const closed=rows.filter(r=>r.status==='已卖出').length;
  const portCounts={};
  rows.forEach(r=>{portCounts[r.portfolio]=(portCounts[r.portfolio]||0)+1;});
  const activePorts=Object.keys(portCounts).length;
  const monthSet=new Set(); rows.forEach(r=>{const m=r.recMonth;if(m)monthSet.add(m);});
  const avgMonth = monthSet.size? (total/monthSet.size).toFixed(1) : '0';
  let topPort='—', topN=0;
  Object.entries(portCounts).forEach(([p,n])=>{if(n>topN){topN=n;topPort=p;}});
  const cells=[
    {v:total,l:'总荐股笔数'},
    {v:holding,l:'持仓（已买入）',c:'blue'},
    {v:closed,l:'平仓（已卖出）',c:'amber'},
    {v:activePorts,l:'活跃组合数'},
    {v:avgMonth,l:'月均荐股数'},
    {v:topN,l:'最活跃组合',sub:topPort}
  ];
  $('kpis').innerHTML = cells.map(c=>'<div class="kpi"><div class="v '+(c.c||'')+'">'+c.v+'</div><div class="l">'+c.l+(c.sub?'<br><span style="font-size:11px;color:var(--muted)">'+c.sub+'</span>':'')+'</div></div>').join('');
}

function monthSeries(rows){
  const map={};
  rows.forEach(r=>{
    const m = r.recMonth;
    if(m==null) return;
    if(!map[m]) map[m]={month:m,holding:0,closed:0};
    if(r.status==='已买入') map[m].holding++; else map[m].closed++;
  });
  return Object.values(map).sort((a,b)=>a.month<b.month?-1:1);
}

function renderMonthly(rows){
  const s=monthSeries(rows);
  const W=720,H=260,pl=38,pr=12,pt=14,pb=28;
  const iw=W-pl-pr, ih=H-pt-pb;
  const maxV=Math.max(1,...s.map(d=>d.holding+d.closed));
  const n=s.length||1;
  const bw=iw/n*0.62, gap=iw/n;
  let bars='',xlab='',zeroY=pt+ih;
  s.forEach((d,i)=>{
    const x=pl+i*gap+(gap-bw)/2;
    const hH=d.holding/maxV*ih, cH=d.closed/maxV*ih;
    bars+=`<rect x="${x}" y="${zeroY-hH}" width="${bw/2-1}" height="${hH}" fill="${C.blue}"></rect>`;
    bars+=`<rect x="${x+bw/2+1}" y="${zeroY-cH}" width="${bw/2-1}" height="${cH}" fill="${C.amber}"></rect>`;
    xlab+=`<text x="${x+bw/2}" y="${H-10}" fill="${C.muted}" font-size="10" text-anchor="middle">${d.month.slice(2)}</text>`;
  });
  let ylab='';
  for(let t=0;t<=4;t++){const v=maxV*t/4;const y=zeroY-v/maxV*ih;ylab+=`<text x="${pl-6}" y="${y+3}" fill="${C.muted}" font-size="9" text-anchor="end">${Math.round(v)}</text><line x1="${pl}" y1="${y}" x2="${W-pr}" y2="${y}" stroke="${C.border}" stroke-width="1"></line>`;}
  $('chart-monthly').innerHTML=`<svg viewBox="0 0 ${W} ${H}">${ylab}${bars}${xlab}</svg>`;
}

function renderMatrix(rows){
  // group by portfolio -> month
  const pm={};
  const months=new Set();
  const pTotals={};
  rows.forEach(r=>{
    const m = r.recMonth;
    if(m==null) return;
    months.add(m);
    if(!pm[r.portfolio]) pm[r.portfolio]={};
    pm[r.portfolio][m]=(pm[r.portfolio][m]||0)+1;
    pTotals[r.portfolio]=(pTotals[r.portfolio]||0)+1;
  });
  const monthList=Array.from(months).sort();
  const portfolios=Object.keys(pTotals).sort((a,b)=>pTotals[b]-pTotals[a]);
  const allValues=[];
  portfolios.forEach(p=>{monthList.forEach(m=>{allValues.push(pm[p]?.[m]||0);});});
  const maxV=Math.max(1,...allValues);

  // header
  let thead='<tr><th class="corner">组合 \ 月份</th>'+monthList.map(m=>`<th>${m.slice(2)}</th>`).join('')+'<th class="corner">合计</th></tr>';
  $('tbl-matrix').querySelector('thead').innerHTML=thead;

  // body
  let tbody='';
  const monthTotals={}; monthList.forEach(m=>monthTotals[m]=0);
  portfolios.forEach(p=>{
    const total=pTotals[p];
    let tr=`<td class="col-total">${p}</td>`;
    monthList.forEach(m=>{
      const v=pm[p]?.[m]||0;
      monthTotals[m]+=v;
      const alpha=0.08+(v/maxV)*0.72;
      tr+=`<td style="background:rgba(88,166,255,${alpha.toFixed(3)})" data-portfolio="${p}" data-month="${m}"><span class="cell-val">${v}</span></td>`;
    });
    tr+=`<td class="row-total">${total}</td>`;
    tbody+=`<tr>${tr}</tr>`;
  });
  // total row
  let trow='<td class="corner">合计</td>';
  monthList.forEach(m=>trow+=`<td class="row-total">${monthTotals[m]}</td>`);
  trow+=`<td class="corner">${monthList.reduce((s,m)=>s+monthTotals[m],0)}</td>`;
  tbody+=`<tr>${trow}</tr>`;
  $('tbl-matrix').querySelector('tbody').innerHTML=tbody;

  // click drilldown
  $('tbl-matrix').querySelectorAll('tbody td[data-month]').forEach(cell=>{
    cell.onclick=()=>{
      state.portfolio=cell.dataset.portfolio;
      state.start=cell.dataset.month;
      state.end=cell.dataset.month;
      $('f-portfolio').value=state.portfolio;
      $('f-start').value=state.start;
      $('f-end').value=state.end;
      saveFilters(); renderAll();
    };
  });
}

function renderPortfolio(rows){
  const map={};
  rows.forEach(r=>{
    if(!map[r.portfolio]) map[r.portfolio]={portfolio:r.portfolio,count:0,holding:0,closed:0};
    const o=map[r.portfolio]; o.count++; if(r.status==='已买入') o.holding++; else o.closed++;
  });
  let arr=Object.values(map);
  // horizontal bar (sorted by count desc)
  arr.sort((a,b)=>a.count-b.count);
  const max=Math.max(1,...arr.map(d=>d.count));
  const W=720,H=Math.max(120,arr.length*22+10),pl=160,pr=40,pt=6;
  let bars='',lab='';
  arr.forEach((d,i)=>{
    const y=pt+i*22+4; const w=d.count/max*(W-pl-pr);
    bars+=`<rect x="${pl}" y="${y}" width="${w}" height="12" rx="3" fill="${C.accent}"></rect>`;
    bars+=`<text x="${pl+w+6}" y="${y+11}" fill="${C.text}" font-size="11">${d.count}</text>`;
    lab+=`<text x="${pl-8}" y="${y+11}" fill="${C.text}" font-size="11" text-anchor="end">${d.portfolio}</text>`;
  });
  $('chart-portfolio').innerHTML=`<svg viewBox="0 0 ${W} ${H}">${lab}${bars}</svg>`;

  // table
  arr.sort((a,b)=> state.sortKey==='portfolio'? (a.portfolio<b.portfolio?1:-1)*state.sortDir : (a[state.sortKey]-b[state.sortKey])*state.sortDir);
  const tb=$('tbl-portfolio').querySelector('tbody');
  tb.innerHTML=arr.map(d=>`<tr><td>${d.portfolio}</td><td class="num">${d.count}</td><td class="num">${d.holding}</td><td class="num">${d.closed}</td></tr>`).join('');
}

function rowHtml(r){
  const tag=r.status==='已买入'?'<span class="tag buy">已买入</span>':'<span class="tag sell">已卖出</span>';
  const note=NOTES[r.id]||'';
  const retc = r.ret==null? '—' : (r.ret>=0?'<span style="color:#f85149">+':'<span style="color:#3fb950">')+(r.ret*100).toFixed(2)+'%</span>';
  return `<tr>
    <td>${r.manager}</td><td>${r.portfolio}</td><td>${r.code}</td>
    <td>${r.name}</td><td>${r.market}</td><td class="num">${fmtNum(r.buyPrice)}</td>
    <td class="num">${fmtNum(r.sellPrice)}</td><td class="num">${retc}</td>
    <td class="col-month">${r.recMonth}</td>
    <td>${r.recDate}</td><td>${r.updDate||'—'}</td><td>${tag}</td>
    <td><input class="note-input" data-id="${r.id}" value="${note.replace(/"/g,'&quot;')}" placeholder="备注…"></td>
  </tr>`;
}
function bindNotes(){ $('tbl-detail').querySelectorAll('.note-input').forEach(inp=>{ inp.addEventListener('input',e=>{const id=+e.target.dataset.id;NOTES[id]=e.target.value;localStorage.setItem('xhy_notes',JSON.stringify(NOTES));}); }); }
function renderDetail(rows){
  const tbl=$('tbl-detail'), tb=tbl.querySelector('tbody');
  const numSort=(va,vb)=> (va==null? (vb==null?0:1) : (vb==null?-1 : va-vb));
  if(state.detailMode==='month'){
    tbl.classList.add('grouped');
    const months=Array.from(new Set(rows.map(r=>r.recMonth))).filter(Boolean).sort();
    let html='';
    months.forEach(m=>{
      const grp=rows.filter(r=>r.recMonth===m);
      const avg=grp.reduce((s,r)=>s+(r.ret||0),0)/grp.length;
      const win=grp.filter(r=>r.ret>0).length;
      html+=`<tr class="grp"><td colspan="12">荐股月份 <b style="color:var(--text)">${m}</b>　共 <b>${grp.length}</b> 笔　月均收益 <b style="color:${avg>=0?'#f85149':'#3fb950'}">${(avg*100).toFixed(2)}%</b>　盈利 <b>${win}</b>/${grp.length}</td></tr>`;
      const arr=grp.slice().sort((a,b)=> numSort(a.ret,b.ret)*state.dtSortDir);
      html+=arr.map(rowHtml).join('');
    });
    tb.innerHTML=html;
  } else {
    tbl.classList.remove('grouped');
    const arr=[...rows];
    const dk = DT_KEYS.includes(state.dtSortKey)? state.dtSortKey : 'ret';
    const numericKeys=['buyPrice','sellPrice','ret'];
    arr.sort((a,b)=>{
      const va=a[dk], vb=b[dk]; let c;
      if(numericKeys.includes(dk)){ c = (va==null? (vb==null?0:1) : (vb==null?-1 : va-vb)); }
      else { c = (va<b[dk]?-1: (va>b[dk]?1:0)); }
      return c*state.dtSortDir;
    });
    tb.innerHTML=arr.map(rowHtml).join('');
  }
  $('detail-count').textContent='（'+rows.length+' 笔 · '+(state.detailMode==='month'?'按月分组，组内按荐股收益率从高到低':'默认按荐股收益率从高到低')+'）';
  bindNotes();
}

function renderAll(){
  const rows=applyFilters();
  renderKPIs(rows); renderMonthly(rows); renderMatrix(rows); renderPortfolio(rows); renderDetail(rows);
}

const PF_KEYS=['portfolio','count','holding','closed'];
const DT_KEYS=['manager','portfolio','code','name','market','buyPrice','sellPrice','ret','recMonth','recDate','updDate','status'];

function initControls(){
  const pf=$('f-portfolio');
  pf.innerHTML='<option value="ALL">全部组合</option>'+DATA.portfolios.map(p=>`<option value="${p}">${p}</option>`).join('');
  pf.value=state.portfolio;
  $('f-market').value=state.market;
  $('f-status').value=state.status;
  const ms=DATA.months;
  $('f-start').innerHTML='<option value="">—</option>'+ms.map(x=>`<option value="${x}">${x}</option>`).join('');
  $('f-end').innerHTML='<option value="">—</option>'+ms.map(x=>`<option value="${x}">${x}</option>`).join('');
  $('f-start').value=state.start||'';
  $('f-end').value=state.end||'';

  pf.onchange=e=>{state.portfolio=e.target.value;saveFilters();renderAll();};
  $('f-market').onchange=e=>{state.market=e.target.value;saveFilters();renderAll();};
  $('f-status').onchange=e=>{state.status=e.target.value;saveFilters();renderAll();};
  $('f-start').onchange=e=>{state.start=e.target.value||null;saveFilters();renderAll();};
  $('f-end').onchange=e=>{state.end=e.target.value||null;saveFilters();renderAll();};
  $('btn-reset').onclick=()=>{state.portfolio='ALL';state.market='ALL';state.status='ALL';state.start=null;state.end=null;$('f-portfolio').value='ALL';$('f-market').value='ALL';$('f-status').value='ALL';$('f-start').value='';$('f-end').value='';saveFilters();renderAll();};
  $('seg-detail').querySelectorAll('button').forEach(b=>{
    b.onclick=()=>{state.detailMode=b.dataset.v;$('seg-detail').querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');renderDetail(applyFilters());};
  });
  $('btn-csv').onclick=()=>{
    const rows=applyFilters();
    const head=['主理人','组合','代码','名称','市场','买入价','卖出价','荐股收益率','荐股月份','荐股日期','卖出日期','状态','备注'];
    const lines=[head.join(',')];
    rows.forEach(r=>{const note=(NOTES[r.id]||'').replace(/,/g,' ');const retc=r.ret==null?'':(r.ret*100).toFixed(2)+'%';lines.push([r.manager,r.portfolio,r.code,r.name,r.market,r.buyPrice,r.sellPrice,retc,r.recMonth,r.recDate,r.updDate||'',r.status,note].join(','));});
    const blob=new Blob(['﻿'+lines.join(String.fromCharCode(10))],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='鑫汇盈荐股频率_'+new Date().toISOString().slice(0,10)+'.csv';a.click();
  };
  $('tbl-portfolio').querySelectorAll('th[data-k]').forEach(th=>{
    th.onclick=()=>{const k=th.dataset.k;if(state.sortKey===k)state.sortDir*=-1;else{state.sortKey=k;state.sortDir=-1;}renderAll();};
  });
  $('tbl-detail').querySelectorAll('th[data-k]').forEach(th=>{
    th.onclick=()=>{const k=th.dataset.k;if(k==='note')return;if(state.dtSortKey===k)state.dtSortDir*=-1;else{state.dtSortKey=k;state.dtSortDir=-1;}renderAll();};
  });
}

renderMeta(); initControls(); renderAll();
</script>
</body>
</html>
